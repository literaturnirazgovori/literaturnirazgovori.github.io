# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Build and deploy Jekyll site
# https://jekyllrb.com/docs/continuous-integration/github-actions/#setting-up-the-action

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["work"]

    # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# permissions:
#   contents: read
#   pages: write
#   id-token: write
permissions: write-all

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Get all changed files in this commit
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          json: true
          # escape_json: true        
  
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}      
        run: |
          # for file in ${ALL_CHANGED_FILES}; do
          #   echo "$file was changed"
          # done
          # 
          # echo "${ALL_CHANGED_FILES}"

          git config core.quotepath false
          git config --global user.email "alrotem@gmail.com"
          git config --global user.name "Alon Rotem"

          pip install --upgrade pip
          pip install python-frontmatter typing-extensions
          python ./utils/generate-shortlinks.py

          numChangedFiles=$(git status -s | wc -l)
          echo "$numChangedFiles files pending push!"
          
          if [[ $numChangedFiles > 0 ]]
          then
            echo "Pushing $numChangedFiles changed files..."
            git remote set-url --push origin "https://alonrotem:${{ secrets.GITHUB_TOKEN }}@github.com/literaturnirazgovori/literaturnirazgovori.github.io"
            git add .
            git commit -m"Updating shortlinks"
            git push
          else
            echo "No files changed, no pending push."
          fi          

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.2'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "./_site" \
            --exclude=.git \
            --exclude=.github \
            --exclude='.[^/]*' \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
